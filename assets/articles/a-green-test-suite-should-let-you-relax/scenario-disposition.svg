<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Where 155 legacy test scenarios went</title>
  <desc id="desc">A stacked bar shows 6 scenarios retained, 87 replaced at a better test layer, and 62 removed because they were duplicate, outdated, or tested setup.</desc>
  <rect width="1200" height="675" fill="#fcfcfa"/>
  <g font-family="IBM Plex Sans, Inter, Arial, sans-serif" fill="#292926">
    <text x="90" y="92" font-size="25" font-weight="500" letter-spacing="2" fill="#77776f">TEST INVENTORY</text>
    <text x="90" y="154" font-size="48" font-weight="600">Every old scenario got a decision</text>
    <text x="90" y="201" font-size="24" fill="#66665f">The fastest test is the one that no longer belongs in the slow suite.</text>

    <text x="90" y="330" font-size="116" font-weight="600" fill="#9c3d17">155</text>
    <text x="94" y="372" font-size="24" fill="#66665f">legacy scenarios</text>

    <g transform="translate(335 285)">
      <rect x="0" y="0" width="30" height="94" rx="10" fill="#d59b7f"/>
      <rect x="30" y="0" width="435" height="94" fill="#9c3d17"/>
      <rect x="465" y="0" width="310" height="94" rx="10" fill="#3f5f54"/>

      <line x1="0" y1="122" x2="775" y2="122" stroke="#d9d6cf" stroke-width="2"/>

      <g transform="translate(0 165)">
        <circle cx="10" cy="0" r="10" fill="#d59b7f"/>
        <text x="31" y="8" font-size="27" font-weight="600">6 retained</text>
        <text x="31" y="43" font-size="20" fill="#77776f">already at the right layer</text>
      </g>

      <g transform="translate(255 165)">
        <circle cx="10" cy="0" r="10" fill="#9c3d17"/>
        <text x="31" y="8" font-size="27" font-weight="600">87 replaced</text>
        <text x="31" y="43" font-size="20" fill="#77776f">proved in a better way</text>
      </g>

      <g transform="translate(520 165)">
        <circle cx="10" cy="0" r="10" fill="#3f5f54"/>
        <text x="31" y="8" font-size="27" font-weight="600">62 removed</text>
        <text x="31" y="43" font-size="20" fill="#77776f">duplicate, outdated, or setup-only</text>
      </g>
    </g>

    <text x="90" y="604" font-size="20" fill="#77776f">OptiPod test architecture refactor · PR #73</text>
  </g>
</svg>
