# Lint config for the scripts in tools/.
#
# line-length is 140 rather than the default 88 because build_site.py holds HTML
# templates whose lines cannot be broken without changing the output: SVG `path`
# data and element attribute lists must stay intact. Actual Python statements in
# these files sit comfortably under 100.

line-length = 140

[lint]
select = ["E", "F", "W", "B", "SIM", "PERF", "UP", "I", "C4", "ISC", "DTZ"]
